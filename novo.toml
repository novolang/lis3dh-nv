[package]
name        = "lis3dh-nv"
version     = "0.1.0"
description = "A driver for ST's LIS3DH three-axis accelerometer on an I2C or an SPI bus: the acceleration in milli-g, the four full scales, the three resolution modes and the output data rates, the data-ready line, the FIFO as an option, the self-test and WHO_AM_I, as devices-nv's Accelerometer and Identifiable."
license     = "Apache-2.0"
stability   = "experimental"
category    = "embedded"
layer       = "host"
tags        = ["lis3dh", "lis2dh12", "accelerometer", "i2c", "spi", "sensor", "nrf52840-dk", "nrf54lm20-dk"]
repository  = "https://github.com/novolang/lis3dh-nv"
maintainers = ["novo-lang"]
novo        = ">= 0.24.0"

[docs.pages]
"README.md" = "Reading a LIS3DH accelerometer from a device program"

[dependencies]
# The board's I2C bus, SPI bus and GPIO handles, and the I2cBus, SpiBus
# and GpioOut traits they implement.
embedded-hal-nv = "^0.3.2"
# The wiring record a board's device table hands `attach`, the register
# helpers, and the Accelerometer and Identifiable traits.
devices-nv      = "^0.3.2"
